<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIDERMAN PROTIP</title>
  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#07111f,#111827,#05070d);
      font-family:Arial,Helvetica,sans-serif;
      color:white;
      text-align:center;
      padding:25px;
    }

    .box{
      width:min(900px,100%);
      padding:50px 25px;
    }

    h1{
      font-size:clamp(42px,8vw,85px);
      margin-bottom:15px;
      letter-spacing:-3px;
    }

    .sub{
      color:#b9c2cf;
      font-size:18px;
      margin-bottom:45px;
    }

    .buttons{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:20px;
      max-width:700px;
      margin:auto;
    }

    a{
      text-decoration:none;
      color:white;
      padding:25px 20px;
      border-radius:18px;
      font-size:22px;
      font-weight:bold;
      transition:.2s;
      border:1px solid rgba(255,255,255,.15);
    }

    .pc{
      background:#1d4ed8;
    }

    .mobile{
      background:#b91c1c;
    }

    a:hover{
      transform:translateY(-4px);
      filter:brightness(1.15);
    }

    small{
      display:block;
      margin-top:35px;
      color:#7d8795;
    }

    @media(max-width:650px){
      .buttons{
        grid-template-columns:1fr;
      }

      h1{
        font-size:45px;
      }
    }
  </style>
</head>

<body>

  <main class="box">

    <h1>SPIDERMAN PROTIP</h1>

    <p class="sub">
      Elige la versión adecuada para tu dispositivo.
    </p>

    <div class="buttons">

      <a class="pc"
         href="SPIDERMAN_PROTIP_PC_TOUCH_V2.html">
        🖥️ JUGAR EN PC
      </a>

      <a class="mobile"
         href="SPIDERMAN_PROTIP_TELEFONO_TOUCH_V2.html">
        📱 JUGAR EN TELÉFONO
      </a>

    </div>

    <small>
      Proyecto en desarrollo · Versión de prueba
    </small>

  </main>

</body>
</html>
